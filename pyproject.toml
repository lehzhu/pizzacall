[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicedemo"
version = "0.1.0"
description = "Deterministic outbound pizza ordering voice agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "twilio>=9.2,<10.0",
  "python-multipart>=0.0.9,<1.0",
  "deepgram-sdk>=6.1,<7.0",
  "groq>=1.1,<2.0",
  "cartesia>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
